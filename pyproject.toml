[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Wrapper.py"
dynamic = ["version"]
description = "An easy to use Minecraft server wrapper for adding extra functionality"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "???"}
authors = [
    {name = "Ben Baptist"}
]
keywords = ["minecraft", "server", "wrapper", "plugin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "passlib==1.7.1",
    "Flask-SocketIO>=5.4.1",
    "Flask>=3.0.3",
    "msgpack",
    "psutil",
    "future",
    "waitress",
    "importlib_resources",
    "nbt==1.5.1",
    "humanize==2.6.0",
    "requests",
]

[project.urls]
Homepage = "https://github.com/benbaptist/wrapper.py"
Repository = "https://github.com/benbaptist/wrapper.py"
"Bug Tracker" = "https://github.com/benbaptist/wrapper.py/issues"
Chat = "https://gitter.im/benbaptist/wrapper.py"

[project.scripts]
mcwrapper = "wrapper.__init__:main"

[tool.setuptools]
packages = ["wrapper", "wrapper.backups", "wrapper.commons", "wrapper.commons.files", 
            "wrapper.dashboard", "wrapper.dashboard.admin", "wrapper.dashboard.login",
            "wrapper.log_manager", "wrapper.mojang", "wrapper.plugins", "wrapper.plugins.api",
            "wrapper.server", "wrapper.server.commands", "wrapper.server.mcserver", 
            "wrapper.server.mcserver.console_parser", "wrapper.server.world"]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "wrapper.__version__.__version__"}

[tool.setuptools.package-data]
wrapper = [
    "*.py",
    "backups/*.py",
    "dashboard/*.py",
    "dashboard/login/*.py",
    "dashboard/admin/*.py",
    "dashboard/static/images/*.png",
    "dashboard/admin/templates/*.html",
    "dashboard/login/templates/*.html",
    "dashboard/templates/*.html",
    "dashboard/static/css/*.css",
    "dashboard/static/js/*.js",
    "log_manager/*.py",
    "plugins/*.py",
    "server/*.py",
    "commons/files/*.json",
]
